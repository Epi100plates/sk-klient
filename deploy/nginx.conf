# Przykładowa konfiguracja nginx dla strony statusu (sk-klient).
# Ścieżki i certyfikaty dostosuj do serwera. Plik jest wzorem, nie jest
# instalowany automatycznie.

server {
    listen 443 ssl http2;
    server_name status.example.pl;

    root /var/www/sk-klient/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/ssl/certs/status.example.pl.pem;
    ssl_certificate_key /etc/ssl/private/status.example.pl.key;

    # Cała reszta adresów nie istnieje - pokazujemy wyłącznie stronę statusu.
    location / {
        return 404;
    }

    # Token bez wartości nie ma sensu: 404, bez przekierowania (nie ujawniamy kształtu linku).
    location = /status {
        return 404;
    }

    location = /status/ {
        return 404;
    }

    # Strona statusu: token parsuje PHP z REQUEST_URI.
    location ^~ /status/ {
        limit_except GET { deny all; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/sk-klient/index.php;
        fastcgi_param SCRIPT_NAME /status;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Statyczne assety widoku.
    location ^~ /tracking/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~* ^/(favicon\.ico|favicon\.svg|favicon-32\.png|apple-touch-icon\.png)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=15552000" always;
        access_log off;
    }

    # Pliki konfiguracji i bibliotek nie są serwowane.
    location ~ \.(php|inc)$ {
        deny all;
    }
}
